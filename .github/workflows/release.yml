name: Release app Windows/Linux/macOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # A merge to main only cuts a release when it actually bumps the version --
  # otherwise every unrelated merge would try to republish the current one.
  # Running the workflow by hand always releases.
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should-release: ${{ steps.check.outputs.should-release }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Has the version changed?
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run, releasing."
            echo "should-release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current=$(jq -r .version package.json)
          previous=$(git show HEAD~1:package.json 2>/dev/null | jq -r .version || echo none)
          echo "previous=$previous current=$current"

          if [ "$current" != "$previous" ]; then
            echo "should-release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version unchanged, skipping release."
            echo "should-release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.should-release == 'true'

    strategy:
      matrix:
        os:
          [
            { name: 'windows', image: 'windows-2022' },
            { name: 'linux', image: 'ubuntu-latest' },
            { name: 'macos', image: 'macos-latest' }
          ]

    runs-on: ${{ matrix.os.image }}
    continue-on-error: true

    env:
      SHOULD_APPLE_SIGN: ${{ matrix.os.name == 'macos' && '1' || '0' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Import Apple certificate (macOS only)
        if: matrix.os.name == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create a temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Create keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Decode and import certificate
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Add keychain to search list
          security list-keychain -d user -s $KEYCHAIN_PATH

      - run: npm ci

      - name: Publish app
        run: npm run publish
